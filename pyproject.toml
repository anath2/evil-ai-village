[project]
name = "evil-ai-village"
version = "0.1.0"
description = "A sandboxed village of Chinese open-weight AI agents that form societies while solving CyberGym hacking tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=2.0"]
concordia = ["gdm-concordia[openai]>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]
