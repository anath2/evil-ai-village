[project]
name = "evil-ai-village"
version = "0.1.0"
description = "A sandboxed village of Chinese open-weight AI agents that form societies while solving CyberGym hacking tasks"
readme = "README.md"
requires-python = ">=3.12"  # cybergym and gdm-concordia extras require >=3.12
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
cybergym = ["cybergym[server] @ https://github.com/sunblaze-ucb/cybergym/archive/c6fe2027d39471375920b92cf1025e23a99ffda5.zip"]
mcp = ["mcp>=2.0"]
concordia = ["gdm-concordia[openai]>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]

# Required so uv treats this as a package and installs `village` (uv sync /
# uv run). Without it, uv assumes a non-package project and skips installation.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
